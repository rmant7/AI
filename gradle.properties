# Required by AGP; harmless for the JVM-only modules.
android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ABIs the Android modules build native code for. Phones only need arm64 —
# the published APK is arm64-only; CI's emulator smoke test overrides this
# with -Plocalai.abis=x86_64 (see .github/workflows/android.yml).
localai.abis=arm64-v8a
