name: build-apk

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The JVM modules build and test without the Android SDK; running them
      # first means a logic regression fails in seconds rather than after a
      # full Android build.
      - name: Test core and openai
        run: ./gradlew --no-daemon :core:test :openai:test 2>&1 | tee -a build.log

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee -a build.log

      - name: Name the APK after the build
        id: apk
        run: |
          set -euo pipefail
          src=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          out="local-ai-studio-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: local-ai-studio-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # The build's outcome, published where a plain `git fetch` can read it.
      # Useful beyond automation: the ci-status branch shows why a build failed
      # without opening the Actions logs.
      - name: Publish build status to the ci-status branch
        if: always()
        run: |
          set -uo pipefail
          mkdir -p /tmp/status
          {
            echo "run: ${GITHUB_RUN_NUMBER}"
            echo "sha: ${GITHUB_SHA}"
            echo "job status: ${{ job.status }}"
            echo "---"
            grep -E "^e: |^w: .*error|FAILURE:|BUILD (SUCCESSFUL|FAILED)|Execution failed|Caused by:|^\s+> " build.log 2>/dev/null | tail -60 || echo "no build log"
          } > /tmp/status/status.txt
          cd /tmp/status
          git init -q .
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git checkout -q -b ci-status
          git add status.txt
          git commit -q -m "build ${GITHUB_RUN_NUMBER}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-status

      # A release asset is downloadable with a plain URL, which an artifact is
      # not — that is the difference between "the build produced an APK" and
      # "you can install it".
      - name: Publish the APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --title "Local AI Studio debug APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Debug build of ${GITHUB_SHA}. Устанавливается без подписи релиза; runtime по умолчанию — встроенный демонстрационный, адрес OpenAI-совместимого сервера задаётся в настройках." \
            --prerelease

  # An APK that compiles is not the same as an app that runs. This launches the
  # real app on an emulator and drives the chat through the stub runtime, which
  # exercises router, pipeline, context assembly and memory on Android itself.
  smoke-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
